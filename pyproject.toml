[project]
name = "route-optimizer"
version = "0.1.0"
description = "Vehicle routing with time windows and capacity: nearest-neighbour baseline and local search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
route-optimizer = "route_optimizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=route_optimizer --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
